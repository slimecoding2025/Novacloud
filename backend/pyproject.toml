[project]
name = "novacloud"
version = "0.2.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 130
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101", "S608", "E731", "B008"]  # assert in tests; bound-parameter SQL only; FastAPI Depends()

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
packages = ["novacloud"]

[tool.bandit]
exclude_dirs = ["tests"]

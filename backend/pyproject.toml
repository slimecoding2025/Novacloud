[project]
name = "novacloud"
version = "0.2.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 160
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = [
  "S101", "S608", "E731", "B008",   # assert in tests; bound-parameter SQL only; lambda assignment; FastAPI Depends()
  "UP017", "UP042", "UP035", "B905",  # modernisation style rules
  "S310", "S607", "S108",            # fixed internal runner URL; docker CLI by name; container /tmp tmpfs mounts
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E702", "E401", "I001", "E501", "F841"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
packages = ["novacloud"]

[tool.bandit]
exclude_dirs = ["tests"]
# Reviewed and accepted (see docs/threat-model.md):
#  B404/B603/B607  runner calls `docker` with argument lists built from validated templates; no shell.
#  B104            the runner listens on all interfaces inside its container, which sits on an internal-only network.
#  B108            "/tmp" is a tmpfs mount point inside managed containers, not a host path.
#  B310            runner URL comes from server configuration, never from user input.
skips = ["B404", "B603", "B607", "B104", "B108", "B310"]

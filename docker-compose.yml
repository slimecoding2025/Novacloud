services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: novacloud, POSTGRES_PASSWORD: novacloud, POSTGRES_DB: novacloud }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U novacloud"], interval: 5s, retries: 10 }
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://novacloud:novacloud@db:5432/novacloud
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]
  prometheus:
    image: prom/prometheus
    volumes: ["./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana-oss
    ports: ["3001:3000"]
volumes:
  pgdata:

name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_USER: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests
      - run: mypy
      - run: bandit -q -c pyproject.toml -r src
      - run: pip-audit -r requirements.txt
      - name: Tests (unit, API and real PostgreSQL schema tests)
        run: pytest -q
      - name: Migrations apply on an empty database
        env: { DATABASE_URL: "postgresql+psycopg://postgres:ci@localhost:5432/postgres" }
        run: PYTHONPATH=src alembic upgrade head && PYTHONPATH=src alembic downgrade base

  frontend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      # Dev-only advisories (esbuild/vite dev server) are not shipped; fail on vulnerabilities in runtime dependencies.
      - run: npm audit --omit=dev --audit-level=high

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --no-banner --redact
      - name: Dockerfile lint (hadolint)
        run: |
          for f in backend/Dockerfile backend/Dockerfile.runner frontend/Dockerfile; do
            docker run --rm -i hadolint/hadolint hadolint --failure-threshold error - < "$f"
          done
      - name: Filesystem and config scan (trivy)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest fs /src \
            --severity HIGH,CRITICAL --exit-code 1 --scanners vuln,misconfig,secret

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compose file validates
        run: |
          cp .env.example .env
          docker compose config -q

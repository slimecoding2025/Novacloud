server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  client_max_body_size 12m;
  location /api/ { proxy_pass http://api:8000; proxy_set_header X-Forwarded-For $remote_addr; }
  location / { try_files $uri /index.html; }
}
